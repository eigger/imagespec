name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with optional extras)
        run: pip install -e ".[dev,datamatrix]"
      - name: Run tests
        run: pytest -q
      - name: Schema export is up to date
        run: python scripts/export_schema.py --check

  # Install the *lowest* version each floor in pyproject.toml allows and run the
  # suite, so a floor that is too low (e.g. an API we use that only landed in a
  # later release) fails here instead of in a downstream install. The regular
  # `test` job always resolves to the newest releases and cannot catch that.
  test-min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - name: Install at lowest allowed direct-dependency versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev,datamatrix,yaml]"
          uv pip list
      - name: Run tests
        run: uv run --no-sync pytest -q

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-min-deps]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify metadata
        run: twine check dist/*
      - name: Verify bundled assets and license files are in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "imagespec/fonts/NotoSansKR-Regular.ttf",
              "imagespec/fonts/OFL.txt",
              "imagespec/icons/materialdesignicons-webfont.ttf",
              "imagespec/icons/materialdesignicons-webfont_meta.json",
              "imagespec/icons/LICENSE",
              "imagespec/icons/fontawesome-free-solid.otf",
              "imagespec/icons/fontawesome-free-regular.otf",
              "imagespec/icons/fontawesome-free-brands.otf",
              "imagespec/icons/fontawesome-free_meta.json",
              "imagespec/icons/LICENSE-FONTAWESOME",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print("MISSING from wheel:", missing); sys.exit(1)
          # license-files (PEP 639) land under <dist-info>/licenses/
          license_names = {n.rsplit("/", 1)[-1] for n in names if "/licenses/" in n}
          required_licenses = {"LICENSE", "LICENSE-APACHE-2.0", "NOTICE"}
          missing_licenses = required_licenses - license_names
          if missing_licenses:
              print("MISSING from dist-info/licenses:", missing_licenses); sys.exit(1)
          print("All bundled assets and license files present in", wheel)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
