name: Release

# Publishes to PyPI when a GitHub Release is published for a v* tag.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. Configure it once at
# https://pypi.org/manage/project/imagespec/settings/publishing/ with:
#   owner = eigger, repo = imagespec, workflow = release.yml, environment = pypi
# If you'd rather use a token, delete the `permissions`/`environment` blocks and
# add `with: { password: ${{ secrets.PYPI_API_TOKEN }} }` to the publish step.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match project version {version!r}")
          PY
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
