# Dependabot — 주 1회 pip / Actions 업데이트
#
# 정책: minor/patch는 그룹으로 자동 PR. **semver-major는 전부 수동 일괄**
# (garage/stash/drop/kibble과 동일 — 메이저 PR을 쪼개면 호환 수정·검증이
# 분산되고, “봇을 끄거나 한 번에 올리라”는 운영 부담이 생긴다).
#
# imagespec은 PyPI 라이브러리고 lockfile이 없다. 런타임 하한
# (`pillow>=10.0` 등)을 최신에 맞춰 올리면 다운스트림
# (hass-gicisky / hass-niimbot)에 강제 업그레이드가 된다.
# 그래서 pip는 `increase-if-necessary`: 현재 범위가 이미 새 버전을
# 허용하면 매니페스트를 건드리지 않는다. 보안 권고는 ignore에
# 안 걸리므로 그룹으로 한 브랜치에서 받는다.
# Docker / npm은 없음.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      # 위 ignore는 security update에 걸리지 않는다 — "update-types only affects
      # version updates, not security updates"(GitHub 문서). 그래서 권고가 뜰 때마다
      # semver-major 단독 PR이 따로 열린다. 한 그룹으로 묶어서 "major는 한 브랜치에서
      # 일괄"이라는 위 정책과 결이 맞게 배치로 받는다.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
