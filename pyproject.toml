[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imagespec"
version = "0.5.0"
description = "Render images from a declarative YAML/dict spec — shapes, text, charts, QR/barcodes — for e-paper ESL tags and label printers."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE-2.0", "NOTICE"]
authors = [{ name = "eigger" }]
keywords = ["image", "render", "yaml", "spec", "e-paper", "esl", "label", "pillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Operating System :: OS Independent",
]
dependencies = [
    "pillow>=10.4",  # rounded_rectangle narrower than 2*radius raises before 10.4 (battery element)
    "qrcode[pil]>=7.4",
    "python-barcode>=0.15",
    "requests>=2.25",
]

[project.optional-dependencies]
# 'datamatrix' element requires pyStrich; keep optional so the base install stays light.
datamatrix = ["pyStrich>=0.8"]
# Convenience for loading payloads from YAML strings.
yaml = ["PyYAML>=6.0.1"]  # 6.0 has no py3.12+ wheels and fails to build with Cython 3
# Vectorised dithering (identical output, 2-6x faster on large panels).
fast = ["numpy>=2.1"]  # first release with Python 3.13 wheels
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "numpy>=2.1",
    "mypy>=1.14",
    "types-requests>=2.32",
    "types-qrcode>=8.0",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/eigger/imagespec"
Repository = "https://github.com/eigger/imagespec"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Fail on any Pillow API we use that is scheduled for removal, so a
# deprecation shows up here (on the newest-Pillow matrix job) instead of as
# a breakage after the removal.
filterwarnings = ["error:.*will be removed in Pillow.*:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: PIL/handlers intentionally build defaults at call sites.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# tests build deliberately odd payloads and import for side effects
"tests/*" = ["E741"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imagespec = ["fonts/*", "icons/*", "py.typed"]

[tool.mypy]
python_version = "3.13"
files = ["src/imagespec"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
# No stubs published for these; qrcode has types-qrcode (in the dev extra).
module = ["barcode", "barcode.*", "pystrich.*"]
ignore_missing_imports = true
